<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMK GAME SHOP - MYANMAR</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    :root { --main: #00ffd5; --bg: #0a0b10; --card: #161b22; --text: #ffffff; --accent: #21262d; }
    body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: rgba(22, 27, 34, 0.8); text-align: center; padding: 20px; color: var(--main); font-weight: 700; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; }
    section { padding: 20px; max-width: 600px; margin: auto; }
    .auth-card { background: var(--card); border-radius: 25px; padding: 30px; border: 1px solid #30363d; margin-top: 30px; }
    .tabs { display: flex; background: var(--accent); border-radius: 15px; padding: 5px; margin-bottom: 25px; }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-radius: 12px; color: #8b949e; }
    .tab.active { background: var(--main); color: #000; font-weight: bold; }
    
    /* Layout Sections */
    #mainShop, #adminSection, #authSection { display: none; }
    
    /* Diamond Grid Styling */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    .dia-item { background: var(--card); border-radius: 18px; padding: 15px 10px; text-align: center; cursor: pointer; border: 1px solid #30363d; position: relative; transition: 0.3s; }
    .dia-item:hover { border-color: var(--main); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0, 255, 213, 0.1); }
    .dia-icon { font-size: 24px; display: block; margin-bottom: 8px; }
    .amount { display: block; font-weight: 700; font-size: 15px; margin-bottom: 5px; }
    .price { color: var(--main); font-weight: 600; font-size: 13px; background: rgba(0, 255, 213, 0.1); padding: 2px 8px; border-radius: 8px; }

    input { width: 100%; padding: 15px; margin-top: 12px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
    .btn { margin-top: 20px; padding: 15px; background: var(--main); color: #000; text-align: center; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn:active { transform: scale(0.95); }
    
    .payment-info { background: rgba(255,255,255,0.05); border: 1px dashed var(--main); padding: 15px; border-radius: 15px; margin-top: 15px; text-align: center; }
    #popupBg { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 999; padding: 20px; overflow-y: auto; }
    #popupBox { background: var(--card); max-width: 400px; margin: 10px auto; padding: 25px; border-radius: 25px; border: 1px solid #30363d; }
    .pay-selector { display: flex; gap: 10px; margin-top: 15px; }
    .pay-option { flex: 1; padding: 10px; border: 1px solid #30363d; border-radius: 12px; text-align: center; cursor: pointer; }
    .pay-option.active { border-color: var(--main); background: rgba(0,255,213,0.1); color: var(--main); }
</style>
</head>
<body onload="checkLogin()">

<header>PMK GAME SHOP 💎</header>

<section id="authSection">
    <div class="auth-card">
        <div class="tabs">
            <div id="loginTab" class="tab active" onclick="switchAuth('login')">Login</div>
            <div id="signupTab" class="tab" onclick="switchAuth('signup')">Sign Up</div>
        </div>
        <div id="loginForm">
            <input type="text" id="logUser" placeholder="Username">
            <input type="password" id="logPass" placeholder="Password">
            <div class="btn" onclick="processAuth('login')">Login 🔓</div>
        </div>
        <div id="signupForm" style="display:none;">
            <input type="text" id="regUser" placeholder="အသုံးပြုလိုသော အမည်">
            <input type="password" id="regPass" placeholder="လျှို့ဝှက်နံပါတ်">
            <div class="btn" onclick="processAuth('signup')">Register ✨</div>
        </div>
    </div>
</section>

<section id="adminSection">
    <div class="auth-card">
        <h3 style="color:var(--main)">🛠 Admin Control</h3>
        <input type="text" id="banUserField" placeholder="Ban မည့် Username">
        <div class="btn" onclick="banUser()">User ကို Ban မည်</div>
        <div id="banList" style="margin-top:15px;"></div>
        <div class="btn" style="background:#f85149; color:#fff;" onclick="logout()">Admin Logout</div>
    </div>
</section>

<section id="mainShop">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background:var(--card); padding:15px; border-radius:15px; border: 1px solid #30363d;">
        <span>👤 <b id="userLabel" style="color:var(--main);">Guest</b></span>
        <span onclick="logout()" style="color:#f85149; cursor:pointer; font-weight: 600; font-size: 14px;">Logout 🚪</span>
    </div>
    <div class="grid-container" id="diamondGrid"></div>
</section>

<div id="popupBg">
    <div id="popupBox">
        <h3 style="text-align:center; color:var(--main); margin:0;">ORDER DETAILS</h3>
        <div class="pay-selector">
            <div class="pay-option active" id="payKpay" onclick="setPayment('Kpay')">Kpay</div>
            <div class="pay-option" id="payWave" onclick="setPayment('Wave')">Wave</div>
        </div>
        <div class="payment-info">
            <span id="payName">Kpay နံပါတ်</span><br>
            <b style="font-size:18px;">09 750 216 431</b><br>
            <small>(Nyein Ei Phyo)</small>
        </div>
        <input type="text" id="itemName" readonly style="color: var(--main); font-weight: bold;">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="gid" placeholder="Game ID">
            <input type="number" id="sid" placeholder="Zone ID">
        </div>
        <input type="text" id="pNote" placeholder="လုပ်ငန်းစင်အမှတ် 5 လုံးထည့်ပါ">
        <p style="font-size: 12px; color: #8b949e; margin: 15px 0 5px 5px;">ငွေလွှဲဖြတ်ပိုင်းတင်ရန် :</p>
        <input type="file" id="receipt" accept="image/*" style="margin-top: 0;">
        <div class="btn" onclick="sendToBot()">CONFIRM ORDER 🚀</div>
        <div class="btn" style="background:#21262d; color:#fff; margin-top:10px;" onclick="closePopup()">မဝယ်တော့ပါ</div>
    </div>
</div>

<script>
const BOT_TOKEN = '8540139841:AAHk85ZhZybd1Wh_YAWqeCk6OpTCjqNojr8'; 
const ADMIN_IDS = ['8582088849', '7090654595']; 
let selectedPayment = "Kpay";

const diamonds = [
    {n: '11 Diamonds', p: '950', i: '💎'}, {n: '56 Diamonds', p: '4500', i: '💎'}, 
    {n: '112 Diamonds', p: '8900', i: '💎'}, {n: 'Weekly Pass', p: '5700', i: '💳'}, 
    {n: '282 Diamonds', p: '22000', i: '💎'}, {n: '568 Diamonds', p: '44000', i: '💎'},
    {n: '1159 Diamonds', p: '88000', i: '💎'}, {n: '2010 Diamonds', p: '155000', i: '💎'}, 
    {n: '6040 Diamonds', p: '470000', i: '💎'}
];

// ၁။ Login/Ban Status စစ်ဆေးခြင်း
function checkLogin() {
    const savedUser = localStorage.getItem('currentUser');
    const bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];

    if (savedUser) {
        if (bannedList.includes(savedUser)) {
            alert("သင့်အကောင့်မှာ Ban ခံထားရသဖြင့် ဝင်ရောက်၍မရပါ။");
            localStorage.removeItem('currentUser');
            location.reload();
            return;
        }

        if (savedUser === "admin123") {
            showSection('adminSection');
            renderBanList();
        } else {
            document.getElementById('userLabel').innerText = savedUser;
            showSection('mainShop');
            loadDiamonds();
        }
    } else {
        showSection('authSection');
    }
}

function showSection(id) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('adminSection').style.display = 'none';
    document.getElementById('mainShop').style.display = 'none';
    document.getElementById(id).style.display = 'block';
}

// ၂။ Auth Processing
function processAuth(mode) {
    const user = (mode === 'login' ? document.getElementById('logUser').value : document.getElementById('regUser').value).trim();
    const pass = (mode === 'login' ? document.getElementById('logPass').value : document.getElementById('regPass').value);
    
    if(!user || !pass) { alert("အချက်အလက်များ ဖြည့်စွက်ပါ"); return; }

    let bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];
    if(bannedList.includes(user)) {
        alert("ဤအကောင့်မှာ Ban ခံထားရပါသည်။");
        return;
    }

    // Login logic
    localStorage.setItem('currentUser', user);
    checkLogin();
}

// ၃။ Ban/Unban System
function banUser() {
    const u = document.getElementById('banUserField').value.trim();
    if(!u) return;
    let bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];
    if(!bannedList.includes(u)) {
        bannedList.push(u);
        localStorage.setItem('bannedUsers', JSON.stringify(bannedList));
        renderBanList();
        alert(u + " အကောင့်ကို ပိတ်လိုက်ပါပြီ။");
    }
}

function unban(u) {
    let bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];
    bannedList = bannedList.filter(x => x !== u);
    localStorage.setItem('bannedUsers', JSON.stringify(bannedList));
    renderBanList();
}

function renderBanList() {
    let bannedList = JSON.parse(localStorage.getItem('bannedUsers')) || [];
    document.getElementById('banList').innerHTML = bannedList.map(u => `
        <div style="display:flex; justify-content:space-between; background:#0d1117; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #30363d;">
            <span>${u}</span><span onclick="unban('${u}')" style="color:#f85149; cursor:pointer;">Unban</span>
        </div>`).join('');
}

// ၄။ Load Diamonds to Grid
function loadDiamonds() {
    document.getElementById('diamondGrid').innerHTML = diamonds.map(d => `
        <div class="dia-item" onclick="choose('${d.n}', '${d.p}')">
            <span class="dia-icon">${d.i}</span>
            <span class="amount">${d.n}</span>
            <span class="price">${d.p} Ks</span>
        </div>`).join('');
}

// ၅။ Send Order to Bot (With User Name)
async function sendToBot() {
    const currentUser = localStorage.getItem('currentUser');
    const gid = document.getElementById("gid").value;
    const sid = document.getElementById("sid").value;
    const item = document.getElementById("itemName").value;
    const pNote = document.getElementById("pNote").value;
    const file = document.getElementById("receipt").files[0];

    if (!gid || !file) { alert("Game ID နှင့်ရှိလျှင်ည့်သွင်းပေးပါ"); return; }

    const caption = `🛒 *NEW ORDER RECEIVED*\n\n👤 *User:* ${currentUser}\n💎 *Item:* ${item}\n🆔 *Game ID:* ${gid} (${sid})\n💳 *Method:* ${selectedPayment}\n📝 *Note:* ${pNote || 'None'}`;

    for (const id of ADMIN_IDS) {
        const fd = new FormData(); 
        fd.append("chat_id", id); 
        fd.append("photo", file); 
        fd.append("caption", caption);
        fd.append("parse_mode", "Markdown");
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: fd });
    }
    alert("သင့် Order တင်ခြင်း အောင်မြင်ပါသည်။"); 
    closePopup();
}

function setPayment(t) {
    selectedPayment = t;
    document.getElementById('payKpay').className = 'pay-option ' + (t === 'Kpay' ? 'active' : '');
    document.getElementById('payWave').className = 'pay-option ' + (t === 'Wave' ? 'active' : '');
    document.getElementById('payName').innerText = t + " နံပါတ်";
}
function choose(n, p) { document.getElementById("itemName").value = n + " - " + p + " Ks"; document.getElementById("popupBg").style.display = "block"; }
function closePopup() { document.getElementById("popupBg").style.display = "none"; }
function switchAuth(t) {
    document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = t === 'signup' ? 'block' : 'none';
    document.getElementById('loginTab').className = 'tab ' + (t === 'login' ? 'active' : '');
    document.getElementById('signupTab').className = 'tab ' + (t === 'signup' ? 'active' : '');
}
function logout() { localStorage.removeItem('currentUser'); location.reload(); }
</script>
</body>
</html>
