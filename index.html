<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMK GAME SHOP - MYANMAR</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    :root { 
        --main: #00ffd5; 
        --main-dark: #00cca3;
        --bg: #0a0b10; 
        --card: #161b22; 
        --text: #ffffff; 
        --accent: #21262d;
    }

    body {
        margin: 0;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        background-image: radial-gradient(circle at 50% -20%, #00ffd533, transparent);
        min-height: 100vh;
    }

    header {
        background: rgba(22, 27, 34, 0.8);
        backdrop-filter: blur(10px);
        text-align: center;
        padding: 20px;
        color: var(--main);
        font-weight: 700;
        border-bottom: 1px solid #30363d;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    section { padding: 20px; max-width: 500px; margin: auto; }

    /* Login & Signup Card */
    .auth-card {
        background: var(--card);
        border-radius: 25px;
        padding: 30px;
        border: 1px solid #30363d;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        margin-top: 50px;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .tabs { display: flex; background: var(--accent); border-radius: 15px; padding: 5px; margin-bottom: 25px; }
    .tab { 
        flex: 1; text-align: center; padding: 12px; cursor: pointer; 
        border-radius: 12px; transition: 0.3s; font-weight: 600; color: #8b949e;
    }
    .tab.active { background: var(--main); color: #000; }

    /* Diamond Shop Section (Hidden initially) */
    #mainShop { display: none; animation: fadeIn 0.5s ease; }

    .card {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid #30363d;
    }

    .diamond-grid { 
        display: grid; 
        grid-template-columns: repeat(2, 1fr); 
        gap: 15px; 
    }

    .diamond-item {
        background: var(--accent);
        border-radius: 15px;
        padding: 20px 10px;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid transparent;
    }

    .diamond-item:hover {
        border-color: var(--main);
        background: rgba(0, 255, 213, 0.05);
        transform: scale(1.03);
    }

    .price { display: block; color: var(--main); font-weight: 700; margin-top: 5px; }

    /* Form Elements */
    input {
        width: 100%; padding: 15px; margin-top: 15px; border-radius: 12px;
        border: 1px solid #30363d; background: #0d1117; color: white;
        box-sizing: border-box; outline: none;
    }
    input:focus { border-color: var(--main); }

    .btn {
        margin-top: 25px; padding: 15px; background: var(--main);
        color: #000; text-align: center; border-radius: 12px;
        font-weight: 700; cursor: pointer; transition: 0.3s;
    }
    .btn:hover { background: var(--main-dark); }

    .user-info {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--card); padding: 12px 20px; border-radius: 15px;
        margin-bottom: 20px; border: 1px solid #30363d;
    }

    .logout-btn { color: #f85149; cursor: pointer; font-size: 14px; font-weight: 600; }

    /* Popup */
    #popupBg {
        display:none; position:fixed; inset:0; 
        background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
        z-index: 999; padding: 20px;
    }
    #popupBox {
        background: var(--card); max-width: 400px; margin: 20px auto;
        padding: 25px; border-radius: 25px; border: 1px solid var(--main);
    }
</style>
</head>
<body>

<header>PMK GAME SHOP</header>

<section id="authSection">
    <div class="auth-card">
        <h2 style="text-align: center; margin-top: 0; letter-spacing: 2px;">AUTHENTICATION</h2>
        <div class="tabs">
            <div id="loginTab" class="tab active" onclick="switchAuth('login')">Login</div>
            <div id="signupTab" class="tab" onclick="switchAuth('signup')">Sign Up</div>
        </div>
        
        <div id="loginForm">
            <input type="text" id="logUser" placeholder="Username">
            <input type="password" id="logPass" placeholder="Password">
            <div class="btn" onclick="processAuth()">LOGIN ဝင်မည်</div>
        </div>

        <div id="signupForm" style="display:none;">
            <input type="text" id="regUser" placeholder="Username အသစ်">
            <input type="password" id="regPass" placeholder="Password အသစ်">
            <input type="password" placeholder="Confirm Password">
            <div class="btn" onclick="processAuth()">အကောင့်ဖွင့်မည်</div>
        </div>
    </div>
</section>

<section id="mainShop">
    <div class="user-info">
        <span>Player: <b id="userLabel" style="color:var(--main);">Guest</b></span>
        <span class="logout-btn" onclick="logout()">Logout</span>
    </div>

    <div class="card">
        <h2 style="color:var(--main); font-size: 18px; margin-top:0;">💎 MLBB DIAMONDS</h2>
        <div class="diamond-grid">
            <div class="diamond-item" onclick="choose('11 Diamond', '950')">
                <span>11 💎</span><span class="price">950 Ks</span>
            </div>
            <div class="diamond-item" onclick="choose('56 Diamond', '4500')">
                <span>56 💎</span><span class="price">4500 Ks</span>
            </div>
            <div class="diamond-item" onclick="choose('170 Diamond', '13500')">
                <span>170 💎</span><span class="price">13,500 Ks</span>
            </div>
            <div class="diamond-item" onclick="choose('Weekly Pass', '5700')">
                <span>Weekly 🎟</span><span class="price">5,700 Ks</span>
            </div>
        </div>
    </div>
</section>

<div id="popupBg">
    <div id="popupBox">
        <h3 style="text-align:center; color:var(--main);">CONFIRM ORDER</h3>
        <input type="text" id="itemName" readonly style="color:var(--main); font-weight:bold;">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="gid" placeholder="Game ID">
            <input type="number" id="sid" placeholder="Server">
        </div>
        <input type="text" id="pNote" placeholder="Kpay နောက်ဆုံးဂဏန်း ၆ လုံး">
        <p style="font-size: 12px; margin: 15px 0 5px 0;">ငွေလွှဲဖြတ်ပိုင်းတင်ပါ -</p>
        <input type="file" id="receipt" accept="image/*">
        <div class="btn" onclick="sendToBot()">အော်ဒါတင်မည်</div>
        <div class="btn" style="background:#333; color:white; margin-top:10px;" onclick="closePopup()">ပယ်ဖျက်မည်</div>
        <div id="statusMsg" style="text-align:center; margin-top:10px;"></div>
    </div>
</div>

<script>
const BOT_TOKEN = '8540139841:AAHk85ZhZybd1Wh_YAWqeCk6OpTCjqNojr8'; 
const ADMIN_IDS = ['8582088849', '7090654595']; 

// Login/Signup Switch
function switchAuth(type) {
    document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = type === 'signup' ? 'block' : 'none';
    document.getElementById('loginTab').classList.toggle('active', type === 'login');
    document.getElementById('signupTab').classList.toggle('active', type === 'signup');
}

// Auth Process
function processAuth() {
    const user = document.getElementById('logUser').value || document.getElementById('regUser').value;
    const pass = document.getElementById('logPass').value || document.getElementById('regPass').value;

    if(user && pass) {
        document.getElementById('userLabel').innerText = user;
        document.getElementById('authSection').style.display = 'none'; // Hide Login
        document.getElementById('mainShop').style.display = 'block';   // Show Shop
    } else {
        alert("Username နှင့် Password ဖြည့်ပါ။");
    }
}

function logout() { location.reload(); }

function choose(name, price) {
    document.getElementById("itemName").value = name + " - " + price + " Ks";
    document.getElementById("popupBg").style.display = "block";
}

function closePopup() { document.getElementById("popupBg").style.display = "none"; }

async function sendToBot() {
    const gid = document.getElementById("gid").value;
    const sid = document.getElementById("sid").value;
    const item = document.getElementById("itemName").value;
    const pNote = document.getElementById("pNote").value;
    const file = document.getElementById("receipt").files[0];
    const status = document.getElementById("statusMsg");

    if (!gid || !sid || !pNote || !file) { alert("အချက်အလက်စုံအောင်ဖြည့်ပါ။"); return; }

    status.innerText = "ပို့ဆောင်နေသည်...";
    const caption = `📩 ORDER\n💎 Item: ${item}\n🎮 ID: ${gid} (${sid})\n💰 Note: ${pNote}`;

    let success = false;
    for (const id of ADMIN_IDS) {
        const fd = new FormData();
        fd.append("chat_id", id);
        fd.append("photo", file);
        fd.append("caption", caption);
        try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: fd });
            if(res.ok) success = true;
        } catch (e) {}
    }

    if(success) {
        status.innerText = "✅ အောင်မြင်ပါသည်။";
        setTimeout(closePopup, 2000);
    } else {
        status.innerText = "❌ မအောင်မြင်ပါ။";
    }
}
</script>
</body>
</html>
